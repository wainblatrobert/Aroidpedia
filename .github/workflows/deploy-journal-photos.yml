# =====================================================================
# AROIDPEDIA - DEPLOY ON JOURNAL PHOTO PUSH
# FILE VERSION: v5   (8.12.26: also fires on docs/*-pollination/** —
#   the guide-page photo folders. The herbivory photos were the first
#   guide-photo push after this lane existed; without the filter a
#   guide-photo push updates the repo but never deploys.)
# FILE VERSION: v3   (8.10.26: also fires on docs/araceae-tree.v1.json)
# FILE VERSION: v2   (8.10.26: also fires on docs/shapes.json and
#   docs/climate.json - the map and climate data ship through the same
#   no-wait lane as the photos)
# Path in repo: .github/workflows/deploy-journal-photos.yml
#
# Why this exists: GitHub Pages for this repo deploys ONLY through the
# workflows (update-counts.yml daily at 08:05 UTC, search-index,
# biblio) - a plain `git push` to main updates the repo but the live
# site keeps serving the previous artifact. Discovered 8.10.26 when a
# journal-photo sync sat undeployed: the last successful deployment
# predated the push, and nothing was scheduled for six hours.
#
# This workflow closes that gap for the journal photo pipeline: any
# push touching docs/journal/** re-uploads docs/ and deploys. It does
# NOT regenerate counts or the search index - it only ships the docs
# folder as-is. It shares the "pages" concurrency group with the other
# three workflows so deployments stay serialized.
# =====================================================================

name: Deploy journal photos

on:
  push:
    branches: [main]
    paths:
      - "docs/journal/**"
      - "docs/shapes.json"
      - "docs/climate.json"
      # v3 (8.10.26): the phylogeny tree ships through the same lane.
      # Data 1.19.0 was pushed and the site kept serving the previous
      # artifact - a push to docs/ updates the REPO, never the live site.
      - "docs/araceae-tree.v1.json"
      # v4 (8.12.26): the anatomy figure plates (guide-page diagrams)
      # ship through the same lane.
      - "docs/diagrams/**"
      # v5 (8.12.26): the guide-page photo folders (monstera-pollination,
      # alocasia-pollination, ...) ship through the same lane.
      - "docs/*-pollination/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload /docs as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
