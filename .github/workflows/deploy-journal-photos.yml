# =====================================================================
# AROIDPEDIA - DEPLOY ON JOURNAL PHOTO PUSH
# FILE VERSION: v11  (8.26.26: also fires on docs/*-morphology/** -
#   the morphology guide photo folders, exactly the gap v5 closed for
#   the pollination ones. MEASURED, not assumed: the seven Croat plates
#   pushed to docs/philodendron-morphology/ returned 200 from raw and
#   404 from Pages five minutes after the push. Earlier morphology
#   folders LOOKED fine only because an unrelated push in the filter
#   (footer.js) had swept them into a deploy minutes before.)
# FILE VERSION: v9   (8.17.26: also fires on docs/geo-hierarchy.json —
#   the one published place -> country/region/continent/parent table the
#   journal map's zoom views group by. Without the filter the feed sits
#   in the repo and every grouped view falls back to ungrouped zones.)
# FILE VERSION: v7   (8.13.26: also fires on docs/shapes-hd.json and
#   docs/genus-geo.json — the GENUS RANGE MAP's high-detail shapes and
#   per-genus species-count feed ship through the same no-wait lane.)
# FILE VERSION: v6   (8.13.26: also fires on docs/*-QUICK-GUIDE.pdf —
#   the field cards live at the docs ROOT, uppercase, and were only
#   deployed by the daily scheduled workflows before this.)
# FILE VERSION: v5   (8.12.26: also fires on docs/*-pollination/** —
#   the guide-page photo folders. The herbivory photos were the first
#   guide-photo push after this lane existed; without the filter a
#   guide-photo push updates the repo but never deploys.)
# FILE VERSION: v3   (8.10.26: also fires on docs/araceae-tree.v1.json)
# FILE VERSION: v2   (8.10.26: also fires on docs/shapes.json and
#   docs/climate.json - the map and climate data ship through the same
#   no-wait lane as the photos)
# Path in repo: .github/workflows/deploy-journal-photos.yml
#
# Why this exists: GitHub Pages for this repo deploys ONLY through the
# workflows (update-counts.yml daily at 08:05 UTC, search-index,
# biblio) - a plain `git push` to main updates the repo but the live
# site keeps serving the previous artifact. Discovered 8.10.26 when a
# journal-photo sync sat undeployed: the last successful deployment
# predated the push, and nothing was scheduled for six hours.
#
# This workflow closes that gap for the journal photo pipeline: any
# push touching docs/journal/** re-uploads docs/ and deploys. It does
# NOT regenerate counts or the search index - it only ships the docs
# folder as-is. It shares the "pages" concurrency group with the other
# three workflows so deployments stay serialized.
# =====================================================================

name: Deploy journal photos

on:
  # v11 (8.26.26): a missed deploy could not be re-run by hand, which
  # is how the morphology folders went unnoticed - they kept riding
  # other pushes. This makes the lane triggerable from the Actions tab.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/journal/**"
      - "docs/shapes.json"
      - "docs/climate.json"
      # v3 (8.10.26): the phylogeny tree ships through the same lane.
      # Data 1.19.0 was pushed and the site kept serving the previous
      # artifact - a push to docs/ updates the REPO, never the live site.
      - "docs/araceae-tree.v1.json"
      # v4 (8.12.26): the anatomy figure plates (guide-page diagrams)
      # ship through the same lane.
      - "docs/diagrams/**"
      # v5 (8.12.26): the guide-page photo folders (monstera-pollination,
      # alocasia-pollination, ...) ship through the same lane.
      - "docs/*-pollination/**"
      - "docs/*-morphology/**"
      # v6 (8.13.26): the field-card PDFs (docs root, uppercase).
      - "docs/*-QUICK-GUIDE.pdf"
      # v7 (8.13.26): the genus range map's data files.
      - "docs/shapes-hd.json"
      - "docs/genus-geo.json"
      # v8 (8.14.26): the hosted footer bundle - the code injection is
      # a two-line loader now; every footer change ships through here.
      - "docs/footer.js"
      # v9 (8.17.26): the geo hierarchy the journal map's Continents /
      # Regions / Countries / Subzones views group by.
      - "docs/geo-hierarchy.json"
      # v11 (8.26.26): the morphology guide photo folders - the same gap
      # v5 closed for the pollination ones.
      # v10 (8.18.26): the per-genus climate summary the phylogeny genus
      # cards read (tree block v46). Built from climate.json + genus-geo
      # .json, so it is regenerated and pushed whenever either moves.
      - "docs/genus-climate.json"
      # v11 (8.18.26): the per-species climate summaries (S4) — same
      # derivation chain one level down, ~4.5k keys, its own feed.
      - "docs/species-climate.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload /docs as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
