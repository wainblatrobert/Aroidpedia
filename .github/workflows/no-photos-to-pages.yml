# =====================================================================
# NO PHOTOS TO PAGES
#
# GitHub Pages caps a PUBLISHED SITE at 1 GB. On 8.30.26 docs/journal
# had reached 1.52 GB carrying photos for ONE genus of about 150, and
# because a Pages deploy re-uploads the whole tree - there is no
# incremental deploy - every run was pushing over a gigabyte to publish
# a 1.8 KB counts.json.
#
# The photos now live on Cloudflare R2 behind img.aroidpedia.com. What
# belongs in docs/journal from here on is manifest.json and nothing
# else: ~1.6 KB per species naming content-hashed keys that R2 serves.
#
# This job exists because the failure mode is SILENT. Re-adding a copy
# step to the sync script would not error; it would quietly rebuild the
# 1.5 GB, and nobody would notice until a deploy started failing again.
# So the guard is mechanical: adding an image under docs/journal fails
# the push, and the message says where images actually go.
#
# It checks files ADDED, not files PRESENT, because the original 1.5 GB
# is deliberately still in the tree as the rollback net for the cutover
# and is removed in its own commit once that has held.
# =====================================================================

name: No photos to Pages

on:
  push:
    paths:
      - "docs/journal/**"
      - "docs/footer.js"
  pull_request:
    paths:
      - "docs/journal/**"
      - "docs/footer.js"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail if an image was added under docs/journal
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # A new branch, or the first push, reports an all-zero "before".
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${BASE}" ]; then
            echo "No comparable base commit; nothing to check."
            exit 0
          fi

          ADDED="$(git diff --name-only --diff-filter=A "${BASE}" HEAD -- 'docs/journal' \
                   | grep -Ei '\.(jpe?g|png|webp|gif|mp4|webm|m4v)$' || true)"

          if [ -n "${ADDED}" ]; then
            COUNT="$(printf '%s\n' "${ADDED}" | wc -l | tr -d ' ')"
            echo "::error::${COUNT} image file(s) were added under docs/journal."
            printf '%s\n' "${ADDED}" | head -20 | sed 's/^/    /'
            echo ""
            echo "Photos belong on Cloudflare R2, not on GitHub Pages - Pages caps a"
            echo "published site at 1 GB and re-uploads the WHOLE tree on every deploy."
            echo ""
            echo "Publish them with:"
            echo "    python sync-journal-photos.py --genus <Genus> --push"
            echo ""
            echo "which runs scripts/derive_media.py (resize, dedupe, content-hash)"
            echo "then scripts/publish_media.py (upload to R2, write the manifest)."
            echo "Only manifest.json should ever land in docs/journal."
            exit 1
          fi

          echo "No images added under docs/journal."

      # =================================================================
      # THE COUPLING. On 9.1.26 every journal photo on the site became a
      # broken link, and nothing detected it but a human looking at a page.
      #
      # The R2 cutover shipped card-v149-file-v198, which resolves manifest
      # keys against PHOTO_BASE. A CONCURRENT LANE then built its own
      # "FILE v198" from a master predating that change, and v199-v207 all
      # descended from it - so PHOTO_BASE was silently dropped for six
      # versions. Because docs/journal now holds only manifests, and every
      # `f` in one is a content-hashed key that exists ONLY on R2, a card
      # without PHOTO_BASE resolves them against Pages, where those
      # filenames have never existed.
      #
      # The bundle looked fine. The manifests looked fine. Only the pair
      # was wrong, which is why this checks the PAIR.
      # =================================================================
      - name: Manifests and the bundle must agree on where photos live
        run: |
          set -euo pipefail

          HASHED="$(grep -rl '"f":"[a-z-]*/[0-9a-f]\{8\}-' docs/journal \
                    --include=manifest.json 2>/dev/null | wc -l | tr -d ' ')"

          if [ "${HASHED}" = "0" ]; then
            echo "No manifest names a content-hashed key; nothing to couple."
            exit 0
          fi

          echo "${HASHED} manifest(s) name content-hashed R2 keys."

          MISSING=""
          grep -q 'PHOTO_BASE' docs/footer.js || MISSING="PHOTO_BASE"
          grep -q '__base = photos' docs/footer.js \
            || MISSING="${MISSING:+${MISSING} and }__base = photos"

          if [ -n "${MISSING}" ]; then
            echo "::error::docs/footer.js is missing ${MISSING}."
            echo ""
            echo "Those manifests name keys that exist ONLY on img.aroidpedia.com."
            echo "A bundle without PHOTO_BASE resolves them against GitHub Pages,"
            echo "where they have never existed - so EVERY journal photo on EVERY"
            echo "species page becomes a broken link."
            echo ""
            echo "This is almost always a concurrent-lane merge: a footer master"
            echo "built from an older snapshot silently drops the constant."
            echo "Re-apply it to the CURRENT master (identify it by its"
            echo "data-apsc-version stamp, never by filename), rebuild, redeploy."
            exit 1
          fi

          echo "docs/footer.js carries PHOTO_BASE and resolves __base from it."

      - name: Report the published size
        if: always()
        run: |
          echo "docs/ is currently $(du -sh docs | cut -f1)."
          echo "GitHub Pages refuses to publish above 1 GB."
          echo "Images still present under docs/journal (the pre-cutover rollback net):"
          find docs/journal -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \
               -o -iname '*.gif' -o -iname '*.mp4' -o -iname '*.webm' \) \
            | wc -l
